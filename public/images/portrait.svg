<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">Ilustracja: korepetytorka online Anna Kowalska</title>
  <desc id="desc">Uśmiechnięta korepetytorka z okularami, niebieskim swetrem i żółtym szalikiem, z elementami symbolizującymi naukę angielskiego i matematyki.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#fbfdff"/>
    </linearGradient>
  </defs>

  <!-- Tło -->
  <rect x="16" y="16" width="608" height="688" rx="48" fill="url(#bg)"/>

  <!-- Dekoracje -->
  <circle cx="540" cy="120" r="130" fill="#e0eaff" opacity="0.9"/>
  <circle cx="100" cy="620" r="150" fill="#ffebad" opacity="0.5"/>
  <circle cx="540" cy="560" r="40" fill="#ffd97a" opacity="0.85"/>
  <circle cx="150" cy="170" r="18" fill="#c6d8ff"/>
  <circle cx="470" cy="150" r="14" fill="#ffd97a"/>
  <circle cx="170" cy="480" r="10" fill="#c6d8ff" opacity="0.7"/>
  <circle cx="500" cy="470" r="8" fill="#e0eaff"/>

  <!-- Gwiazda -->
  <path d="M95 62 L103 84 L127 84 L108 97 L115 119 L95 105 L75 119 L82 97 L63 84 L87 84 Z" fill="#f7c03c"/>

  <!-- Łuk za sylwetką -->
  <circle cx="320" cy="370" r="208" fill="none" stroke="#c6d8ff" stroke-width="3" opacity="0.55"/>

  <!-- Cień pod stopami -->
  <ellipse cx="320" cy="676" rx="198" ry="24" fill="#0e1733" opacity="0.08"/>

  <!-- Sweter -->
  <path d="M182 720 C182 596 240 548 320 548 C400 548 458 596 458 720 Z" fill="#2f52ea"/>
  <rect x="182" y="692" width="276" height="28" rx="14" fill="#233cd0"/>
  <path d="M282 556 L320 592 L358 556 C340 548 300 548 282 556 Z" fill="#233cd0"/>

  <!-- Szyja -->
  <rect x="296" y="486" width="48" height="72" rx="20" fill="#efc193"/>

  <!-- Szalik -->
  <rect x="258" y="494" width="124" height="30" rx="15" fill="#f7c03c"/>
  <rect x="282" y="516" width="26" height="84" rx="13" fill="#f7c03c" transform="rotate(6 295 558)"/>
  <rect x="330" y="516" width="26" height="58" rx="13" fill="#eea90e" transform="rotate(-6 343 545)"/>

  <!-- Włosy (tył + kok) -->
  <circle cx="320" cy="330" r="115" fill="#131c4f"/>
  <circle cx="320" cy="222" r="40" fill="#131c4f"/>
  <circle cx="320" cy="264" r="11" fill="#f7c03c"/>

  <!-- Twarz -->
  <circle cx="320" cy="400" r="90" fill="#f6c79e"/>

  <!-- Uszy -->
  <circle cx="232" cy="404" r="15" fill="#f6c79e"/>
  <circle cx="408" cy="404" r="15" fill="#f6c79e"/>
  <circle cx="232" cy="404" r="7" fill="#edb98c"/>
  <circle cx="408" cy="404" r="7" fill="#edb98c"/>

  <!-- Grzywka -->
  <path d="M222 398 C222 306 418 306 418 398 C418 398 400 356 366 348 C344 343 332 352 320 362 C308 352 296 343 274 348 C240 356 222 398 222 398 Z" fill="#131c4f"/>

  <!-- Okulary -->
  <rect x="246" y="352" width="58" height="46" rx="16" fill="#ffffff" opacity="0.85" stroke="#233cd0" stroke-width="6"/>
  <rect x="336" y="352" width="58" height="46" rx="16" fill="#ffffff" opacity="0.85" stroke="#233cd0" stroke-width="6"/>
  <line x1="304" y1="372" x2="336" y2="372" stroke="#233cd0" stroke-width="6"/>

  <!-- Oczy -->
  <circle cx="275" cy="375" r="5.5" fill="#131c4f"/>
  <circle cx="365" cy="375" r="5.5" fill="#131c4f"/>

  <!-- Rumieńce -->
  <circle cx="258" cy="434" r="13" fill="#f9a8a0" opacity="0.5"/>
  <circle cx="382" cy="434" r="13" fill="#f9a8a0" opacity="0.5"/>

  <!-- Uśmiech -->
  <path d="M286 440 Q320 466 354 440" stroke="#b4603f" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Znaczek "C1" -->
  <g>
    <rect x="470" y="240" width="104" height="46" rx="23" fill="#ffffff" stroke="#c6d8ff" stroke-width="3"/>
    <text x="522" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#233cd0" text-anchor="middle">C1</text>
  </g>

  <!-- Znaczek "A+" -->
  <g>
    <rect x="64" y="560" width="104" height="48" rx="24" fill="#ffffff" stroke="#c6d8ff" stroke-width="3"/>
    <text x="116" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#2f52ea" text-anchor="middle">A+</text>
  </g>

  <!-- Znaczek "π" -->
  <g>
    <circle cx="540" cy="330" r="36" fill="#ffffff" stroke="#c6d8ff" stroke-width="3"/>
    <text x="540" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#233cd0" text-anchor="middle">π</text>
  </g>
</svg>
